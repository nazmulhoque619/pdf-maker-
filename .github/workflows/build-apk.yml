name: Build and Release Debug APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build Debug APK & Publish Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Ensure debug.keystore exists
        run: |
          if [ ! -f debug.keystore ]; then
            keytool -genkeypair -v \
              -keystore debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Build Debug APK
        run: gradle assembleDebug --no-daemon

      - name: Prepare Release APK
        run: cp app/build/outputs/apk/debug/app-debug.apk SmartPDFMaker-debug.apk

      - name: Upload APK Workflow Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SmartPDFMaker-debug-apk
          path: SmartPDFMaker-debug.apk

      - name: Publish Permanent GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Smart PDF Maker (Latest Debug APK)
          body: |
            Automated Debug APK build for **Smart PDF Maker**.
            Install `SmartPDFMaker-debug.apk` directly on Android 7.0+ (API 24+) devices.
          draft: false
          prerelease: false
          make_latest: true
          files: SmartPDFMaker-debug.apk
